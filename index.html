<style>
/* Layout: app móvil con cabecera fija (marca + búsqueda), contenido en grupos plegables y barra de pestañas inferior. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --ink:#12292C; --muted:#566B6D; --line:#D6E0DE; --hover:#EAF2F0;
  --accent:#0A7C74; --accent-ink:#FFFFFF; --alert:#B8321F; --alert-bg:#FCEBE8;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B1D; --surface:#142629; --ink:#E4EEEC; --muted:#93A8A6; --line:#25403F; --hover:#1B3236;
    --accent:#3CC1B5; --accent-ink:#062321; --alert:#FF9C8B; --alert-bg:#3A1E1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B1D; --surface:#142629; --ink:#E4EEEC; --muted:#93A8A6; --line:#25403F; --hover:#1B3236;
  --accent:#3CC1B5; --accent-ink:#062321; --alert:#FF9C8B; --alert-bg:#3A1E1A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:.01em}
.brand span{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ia{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-body);text-decoration:none}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 16px var(--f-body)}
.search input::placeholder{color:var(--muted)}

main.wrap{padding-block:22px 110px}
.h1{margin:0;font:800 clamp(27px,7vw,36px)/1.05 var(--f-display);text-wrap:balance}
.lead{margin:8px 0 0;max-width:60ch;color:var(--muted)}
.eyebrow{margin:24px 0 8px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);text-decoration:none}
.chip.alert{background:var(--alert-bg);color:var(--alert);border-color:transparent}
.hint{margin:0;color:var(--muted);font-size:14px}

.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.grp.plain{margin-top:0}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 8px 12px 16px;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}
.grp h2{margin:0;flex:1;min-width:0;font:700 17px/1.2 var(--f-display)}
.grp.alert h2{color:var(--alert)}
.count{font:500 12px var(--f-mono);color:var(--muted)}
.chev{flex:none;width:24px;height:24px;margin-right:8px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.grp:not([open]) .chev{transform:rotate(-90deg)}
.grp ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 48px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.link{display:flex;flex-direction:column;gap:2px;min-width:0;padding:12px 4px 12px 16px;text-decoration:none}
.link:hover{background:var(--hover)}
.t{font-weight:500;overflow-wrap:anywhere}
.d{font-size:13px;color:var(--muted)}
.meta{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.star{display:flex;align-items:center;justify-content:center;width:48px;border:0;background:none;color:var(--muted);cursor:pointer}
.star svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 2px;border:0;background:none;color:var(--muted);font:500 12px var(--f-body);cursor:pointer}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);max-width:62ch}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>

  ];

  var QUICK=[
    ['Actualización RCP 2025','https://www.urgenciasyemergen.com/guias-rcp-erc-2025/?s=09',1],
    ['Código ICTUS',F+'0dfcb2_0808134eeb0147c2b37ff5a65b6cb043.pdf',1],
    ['Síndrome coronario agudo',F+'0dfcb2_bcbb9ba0f4264a93975617f7b72760e2.pdf',1],
    ['Anafilaxia pediátrica',G+'41/anafilaxia',1],
    ['iDoctus','https://es.idoctus.com/consulta/medicamentos',0]
  ];

  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.600 5.400 5.900.8-4.300 4.100 1 5.800L12 16.800 6.800 19.600l1-5.800L3.500 9.700l5.900-.8z"/></svg>';
  var CHEV='<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
  function kind(u){
    try{
      var x=new URL(u),p=x.pathname.toLowerCase(),h=x.hostname.replace(/^www\./,'');
      if(p.slice(-4)==='.pdf')return 'PDF';
      if(p.slice(-5)==='.xlsx')return 'Excel';
      if(p.slice(-4)==='.png')return 'Imagen';
      if(h.indexOf('drive.google')>-1||h.indexOf('docs.google')>-1)return 'Drive';
      if(h.indexOf('youtube')>-1)return 'Vídeo';
      return h;
    }catch(e){return 'Web';}
  }

  var ALL=[],BY={};
  S.forEach(function(s){s.groups.forEach(function(g){
    g.list=g.items.map(function(a){
      var it={id:s.id+'|'+g.n+'|'+a[0],t:a[0],u:a[1],d:a[2]||'',s:s,g:g,k:kind(a[1])};
      ALL.push(it);BY[it.id]=it;return it;
    });
  });});

  var favs=new Set();
  try{var raw=localStorage.getItem('medapp-favs');if(raw){JSON.parse(raw).forEach(function(i){if(BY[i])favs.add(i);});}}catch(e){}
  function saveFavs(){try{localStorage.setItem('medapp-favs',JSON.stringify(Array.from(favs)));}catch(e){}}

  var app=document.getElementById('app');
  var qEl=document.getElementById('q');
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var view='inicio';

  function rowHTML(it,showPath){
    var fav=favs.has(it.id);
    var meta=esc(it.k)+(showPath?' · '+esc(it.s.label)+' › '+esc(it.g.n):'');
    return '<li class="row"><a class="link" href="'+esc(it.u)+'" target="_blank" rel="noopener noreferrer"><span class="t">'+esc(it.t)+'</span>'+
      (it.d?'<span class="d">'+esc(it.d)+'</span>':'')+'<span class="meta">'+meta+'</span></a>'+
      '<button type="button" class="star" data-id="'+esc(it.id)+'" aria-pressed="'+fav+'" aria-label="Favorito: '+esc(it.t)+'">'+STAR+'</button></li>';
  }
  function groupHTML(g){
    return '<details class="grp'+(g.alert?' alert':'')+'" open><summary><h2>'+esc(g.n)+'</h2><span class="count">'+g.list.length+'</span>'+CHEV+'</summary><ul>'+
      g.list.map(function(it){return rowHTML(it,false);}).join('')+'</ul></details>';
  }
  function favsHTML(){
    var list=ALL.filter(function(it){return favs.has(it.id);});
    if(!list.length)return '<p class="hint">Toca la estrella de cualquier enlace para tenerlo aquí.</p>';
    return '<div class="grp plain"><ul style="border-top:0">'+list.map(function(it){return rowHTML(it,true);}).join('')+'</ul></div>';
  }
  function renderFavs(){var box=document.getElementById('favs');if(box)box.innerHTML=favsHTML();}

  function renderView(id){
    var s=S.filter(function(x){return x.id===id;})[0]||S[0];
    var html='<h1 class="h1">'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p>';
    if(s.id==='inicio'){
      html+='<div class="eyebrow">Acceso rápido</div><div class="quick">'+QUICK.map(function(c){
        return '<a class="chip'+(c[2]?' alert':'')+'" href="'+esc(c[1])+'" target="_blank" rel="noopener noreferrer">'+esc(c[0])+'</a>';
      }).join('')+'</div>';
      html+='<div class="eyebrow">Favoritos</div><div id="favs">'+favsHTML()+'</div>';
    }
    html+=s.groups.map(groupHTML).join('');
    html+='<p class="foot">© APP-A3. Los enlaces abren sitios externos. Material de consulta: contrasta con la fuente original antes de decidir.</p>';
    app.innerHTML=html;
  }
  function renderSearch(q){
    var words=q.split(/\s+/);
    var res=ALL.filter(function(it){
      var hay=norm(it.t+' '+it.d+' '+it.g.n+' '+it.s.label+' '+it.k);
      return words.every(function(w){return hay.indexOf(w)>-1;});
    });
    var html='<h1 class="h1">Resultados</h1><p class="lead">'+res.length+(res.length===1?' enlace':' enlaces')+' para «'+esc(qEl.value.trim())+'»</p>';
    if(res.length){html+='<div class="grp plain" style="margin-top:16px"><ul style="border-top:0">'+res.map(function(it){return rowHTML(it,true);}).join('')+'</ul></div>';}
    else{html+='<p class="hint" style="margin-top:16px">No hay coincidencias. Prueba con otra palabra, por ejemplo una sigla (RCP, HTA) o el nombre de la escala.</p>';}
    app.innerHTML=html;
  }
  function render(){
    var q=norm(qEl.value.trim());
    tabs.forEach(function(t){
      if(!q&&t.getAttribute('data-view')===view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
    });
    if(q)renderSearch(q);else renderView(view);
  }
  function go(id,fromHash){
    if(!S.some(function(x){return x.id===id;}))return;
    view=id;qEl.value='';render();window.scrollTo(0,0);
    if(!fromHash){try{if(location.hash.slice(1)!==id)location.hash=id;}catch(e){}}
  }

  tabs.forEach(function(t){t.addEventListener('click',function(){go(t.getAttribute('data-view'),false);});});
  qEl.addEventListener('input',render);
  qEl.addEventListener('keydown',function(e){if(e.key==='Escape'){qEl.value='';render();}});
  app.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.star'):null;
    if(!b)return;
    var id=b.getAttribute('data-id');
    if(favs.has(id))favs.delete(id);else favs.add(id);
    saveFavs();
    var on=favs.has(id);
    Array.prototype.forEach.call(app.querySelectorAll('.star'),function(x){
      if(x.getAttribute('data-id')===id)x.setAttribute('aria-pressed',String(on));
    });
    renderFavs();
  });
  window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==view)go(h,true);});

  var h0='';try{h0=location.hash.slice(1);}catch(e){}
  if(S.some(function(x){return x.id===h0;}))view=h0;
  render();
})();
</script>
</body>
</html>
